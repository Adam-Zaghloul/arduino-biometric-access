Mon Code Arduino

#include <Wire.h>
#include <LiquidCrystal_I2C.h>
#include <RTClib.h>
#include <EEPROM.h>

// Initialize components
LiquidCrystal_I2C lcd(0x27, 16, 2);  // I2C LCD at address 0x27
RTC_DS1307 rtc;                      // DS1307 RTC module

// Pin definitions
const int touchPin = 2;              // TTP223 touch sensor
const int buzzerPin = 12;            // Active buzzer
const int ledPin = 11;               // LED (with 220Ω resistor)
const int buttonPins[] = {10, 9, 8, 7}; // Buttons: Menu (D10), Up (D9), Down (D8), Select (D7)

// Constants
const int USER_LOG_SIZE = 105;       // Max EEPROM log entries
const int COUNTER_ADDR = 250;        // EEPROM address for log counter
const unsigned long DEBOUNCE_DELAY = 50;    // Button debounce time (ms)
const unsigned long LONG_PRESS_DURATION = 3000; // Long press time (ms)

// Variables
int currentUser = 1;                 // Current user (1 or 2)
bool modeLogging = true;             // Mode: true = Logging, false = Admin
unsigned long lastButtonTime = 0;    // For button debouncing
DateTime now;                        // Current RTC time
int logIndex = 0;                    // Current EEPROM log index
bool batteryTested = false;          // Flag for battery test
int adminSelectedUser = 1;           // Tracks selected user in admin mode

void setup() {
  // Initialize Serial for debugging
  Serial.begin(9600);
  Serial.println("Biometric System Starting...");

  // Initialize I2C
  Wire.begin();
  
  // Initialize LCD
  lcd.begin(16, 2);
  lcd.backlight();
  lcd.print("System Starting...");

  // Initialize RTC
  if (!rtc.begin()) {
    Serial.println("ERROR: RTC not found!");
    lcd.clear();
    lcd.print("RTC Error!");
    while (1); // Halt on error
  }
  if (!rtc.isrunning()) {
    Serial.println("RTC not running! Setting time...");
    rtc.adjust(DateTime(F(__DATE__), F(__TIME__))); // Set to compile time
    lcd.clear();
    lcd.print("RTC Initialized");
    delay(2000);
  } else {
    Serial.println("RTC is running.");
    now = rtc.now();
    if (now.year() < 2020) { // Check for invalid time
      Serial.println("Invalid RTC time! Setting time...");
      rtc.adjust(DateTime(F(__DATE__), F(__TIME__)));
      lcd.clear();
      lcd.print("RTC Time Reset");
      delay(2000);
    }
  }

  // Initialize pins
  pinMode(touchPin, INPUT);
  pinMode(buzzerPin, OUTPUT);
  pinMode(ledPin, OUTPUT);
  for (int i = 0; i < 4; i++) {
    pinMode(buttonPins[i], INPUT_PULLUP); // Enable internal pull-up resistors
  }

  // Load log index from EEPROM
  logIndex = EEPROM.read(COUNTER_ADDR);
  if (logIndex >= USER_LOG_SIZE) logIndex = 0;

  delay(2000); // Show startup message
  lcd.clear();
}

void loop() {
  now = rtc.now();      // Read current time
  checkButtons();       // Handle button inputs
  checkTouch();         // Check touch sensor
  updateDisplay();      // Update LCD
  if (!batteryTested) {
    testBatteryBackup(); // Run battery test once
  }
  delay(100);           // Loop delay
}

// Check touch sensor and log access
void checkTouch() {
  if (digitalRead(touchPin) == HIGH && modeLogging) {
    logAccess(now);
    digitalWrite(ledPin, HIGH);
    tone(buzzerPin, 1000, 200); // Short beep
    lcd.clear();
    lcd.print("Access Granted");
    lcd.setCursor(0, 1);
    lcd.print("User ");
    lcd.print(currentUser);
    delay(2000);
    digitalWrite(ledPin, LOW);
  }
}

// Log access to EEPROM
void logAccess(DateTime now) {
  int addr = logIndex * 7; // 7 bytes per entry
  EEPROM.write(addr, currentUser);
  EEPROM.write(addr + 1, now.year() >> 8);
  EEPROM.write(addr + 2, now.year() & 0xFF);
  EEPROM.write(addr + 3, now.month());
  EEPROM.write(addr + 4, now.day());
  EEPROM.write(addr + 5, now.hour());
  EEPROM.write(addr + 6, now.minute());
  
  logIndex++;
  if (logIndex >= USER_LOG_SIZE) logIndex = 0;
  EEPROM.write(COUNTER_ADDR, logIndex);

  // Debug log
  Serial.print("Logged: User ");
  Serial.print(currentUser);
  Serial.print(" at ");
  Serial.print(now.year());
  Serial.print('/');
  Serial.print(now.month());
  Serial.print('/');
  Serial.print(now.day());
  Serial.print(" ");
  Serial.print(now.hour());
  Serial.print(':');
  Serial.print(now.minute());
  Serial.println();
}

// Handle button inputs with debouncing
void checkButtons() {
  unsigned long currentTime = millis();
  if (currentTime - lastButtonTime < DEBOUNCE_DELAY) return;

  // Menu button: toggle mode
  if (digitalRead(buttonPins[0]) == LOW) { // D10, active-low
    modeLogging = !modeLogging;
    lcd.clear();
    lcd.print(modeLogging ? "Mode: Logging" : "Mode: Admin");
    delay(1000);
    lastButtonTime = currentTime;
  }

  // Up/Down buttons: behavior depends on mode
  if (modeLogging) {
    // In logging mode, Up/Down switch currentUser
    if (digitalRead(buttonPins[1]) == LOW || digitalRead(buttonPins[2]) == LOW) { // D9 or D8
      currentUser = (currentUser == 1) ? 2 : 1;
      lastButtonTime = currentTime;
    }
  } else {
    // In admin mode, Up/Down switch adminSelectedUser
    if (digitalRead(buttonPins[1]) == LOW) { // Up button, D9
      adminSelectedUser = 1;
      lastButtonTime = currentTime;
    } else if (digitalRead(buttonPins[2]) == LOW) { // Down button, D8
      adminSelectedUser = 2;
      lastButtonTime = currentTime;
    }
  }

  // Select button: only active in admin mode
  if (!modeLogging) {
    if (digitalRead(buttonPins[3]) == LOW) { // D7
      unsigned long pressStart = millis();
      while (digitalRead(buttonPins[3]) == LOW) {
        if (millis() - pressStart > LONG_PRESS_DURATION) {
          resetSystem();
          return;
        }
      }
      if (millis() - pressStart < LONG_PRESS_DURATION) {
        showUserStats(adminSelectedUser);
      }
      lastButtonTime = currentTime;
    }
  }
}

// Display access stats for a specific user
void showUserStats(int user) {
  int accessCount = 0;
  DateTime latestTime = DateTime(2000, 1, 1, 0, 0, 0); // January 1, 2000, 00:00:00

  // Scan all log entries
  for (int i = 0; i < USER_LOG_SIZE; i++) {
    int addr = i * 7;
    if (EEPROM.read(addr) == user) {
      accessCount++;
      // Reconstruct timestamp
      int year = (EEPROM.read(addr + 1) << 8) | EEPROM.read(addr + 2);
      DateTime logTime = DateTime(year, EEPROM.read(addr + 3), EEPROM.read(addr + 4),
                                  EEPROM.read(addr + 5), EEPROM.read(addr + 6), 0);
      if (logTime > latestTime) {
        latestTime = logTime;
      }
    }
  }

  // Display stats
  lcd.clear();
  lcd.print("User ");
  lcd.print(user);
  lcd.print(": ");
  lcd.print(accessCount);
  lcd.setCursor(0, 1);
  if (accessCount == 0) {
    lcd.print("No access");
  } else {
    lcd.print("Latest: ");
    if (latestTime.hour() < 10) lcd.print("0");
    lcd.print(latestTime.hour());
    lcd.print(":");
    if (latestTime.minute() < 10) lcd.print("0");
    lcd.print(latestTime.minute());
  }
  delay(3000); // Show for 3 seconds
}

// Reset system (clear EEPROM logs)
void resetSystem() {
  for (int i = 0; i < USER_LOG_SIZE * 7; i++) {
    EEPROM.write(i, 0);
  }
  EEPROM.write(COUNTER_ADDR, 0);
  logIndex = 0;
  lcd.clear();
  lcd.print("System Reset");
  delay(2000);
}

// Update LCD display based on mode
void updateDisplay() {
  if (modeLogging) {
    lcd.clear();
    lcd.print("Time: ");
    lcd.print(now.hour(), DEC);
    lcd.print(':');
    if (now.minute() < 10) lcd.print('0');
    lcd.print(now.minute(), DEC);
    lcd.setCursor(0, 1);
    lcd.print("User: ");
    lcd.print(currentUser);
  } else {
    lcd.clear();
    lcd.print("Admin: User ");
    lcd.print(adminSelectedUser);
    lcd.setCursor(0, 1);
    lcd.print("Select for stats");
  }
}

// Test RTC battery backup
void testBatteryBackup() {
  static DateTime lastTime = now;
  if (now.year() < 2020) {
    Serial.println("ERROR: RTC time invalid!");
    lcd.clear();
    lcd.print("RTC Error!");
    delay(3000);
    rtc.adjust(DateTime(F(__DATE__), F(__TIME__)));
  } else if (now.unixtime() < lastTime.unixtime()) {
    Serial.println("WARNING: RTC time went backward!");
    lcd.clear();
    lcd.print("RTC Issue!");
    delay(3000);
  }
  lastTime = now;
  batteryTested = true; // Run once unless reset
}

Mon Pseudo code




BEGIN
    // Hardware Initialization
    INITIALIZE COMPONENTS:
        - I2C LCD (Address 0x27, SDA=A4, SCL=A5)
        - RTC Module (DS3231)
        - Touch Sensor (D2)
        - Buzzer (D9)
        - LED (D10)
        - Buttons: Menu(D3), Up(D4), Down(D5), Select(D6)

    // Configure I2C Bus
    CONFIGURE_I2C()

    // System Variables
    CURRENT_USER = 1  // 1 or 2
    MODE = "LOGGING"  // LOGGING or ADMIN
    USER_LOG_SIZE = 105  // 15 entries/user (15 × 7 bytes)

    // Main Loop
    WHILE TRUE DO
        // Read Inputs
        current_time = GET_RTC_TIME()
        touch_state = READ_TOUCH_SENSOR()

        // Update Display Based on Mode
        IF MODE == "LOGGING" THEN
            LCD_PRINT("User: " + CURRENT_USER, line=1)
            LCD_PRINT("Access: " + COUNT_ACCESS(CURRENT_USER), line=2)
        ELSE IF MODE == "ADMIN" THEN
            LCD_PRINT("Admin Menu", line=1)
            LCD_PRINT("[Select] Stats  [Hold] Reset", line=2)
        END IF

        // Handle Touch Event (Logging Mode Only)
        IF touch_state == ACTIVE AND MODE == "LOGGING" THEN
            ACTIVATE_BUZZER(1000Hz, 500ms)
            TURN_ON(LED)
            LOG_ACCESS(CURRENT_USER, current_time)
            DELAY(1000ms)
            TURN_OFF(LED)
        END IF

        // Handle Button Presses
        CHECK_BUTTONS()

        DELAY(100ms)
    END WHILE
END



Components Used
List of hardware components:
Arduino board (the microcontroller running the system)
KY-036 Metal Touch Sensor Module (detects touch input)
DS1307 RTC module (keeps track of time)
I2C LCD (displays system status and logs)
Active buzzer (provides audio feedback)
LED (provides visual feedback)
Four buttons: Menu, Up, Down and Select (for user interaction)


